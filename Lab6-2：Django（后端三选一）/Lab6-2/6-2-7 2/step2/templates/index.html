<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Django 模型</title>
    <link rel="stylesheet" href="/static/layui/css/layui.css">
    <script src="/static/layui/layui.all.js"></script>
    <script src="/static/layui/jquery-3.1.1.min.js"></script>
</head>
<body>
<div class="layui-container">
    <div class="layui-row">
        <div class="layui-col-md12">
            <blockquote class="layui-elem-quote layui-quote-nm">用户信息</blockquote>
        </div>
		<div class="layui-col-md12">
            <form class="layui-form" action="/index" method="post">
                {% csrf_token %}
                <div class="layui-form-item">
                    <div class="layui-inline">
                        <label class="layui-form-label">用户名</label>
                        <div class="layui-input-inline">
                            <input id="input_username" type="text" name="username"  autocomplete="off" value="{{ username }}"
                                   class="layui-input">
                        </div>
                    </div>
                    <div class="layui-inline">
                        <button class="layui-btn" lay-submit lay-filter="formDemo">查询</button>
                        <button type="layui-btn" class="layui-btn layui-btn-primary" id="reset_btn">重置</button>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-col-md12">
            <table class="layui-table">
                <colgroup>
                    <col width="100">
                    <col width="100">
                    <col width="100">
                    <col>
                </colgroup>
                <thead>
                <tr>
                    <th>编号</th>
                    <th>用户名</th>
                    <th>性别</th>
                    <th>签名</th>
                </tr>
                </thead>
                <tbody>
                <!---------- Begin ---------->
                {% for d in datas %}
                    <tr>
                        <td>{{ d.id }}</td>
                        <td>{{ d.username }}</td>
                        <td>{{ d.sex }}</td>
                        <td>{{ d.sign }}</td>
                    </tr>
                {% endfor %}
                <!---------- End ---------->
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
