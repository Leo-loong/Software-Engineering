<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8"/>
    <title></title>
</head>
<link rel="stylesheet" href="/static/layui/css/layui.css"/>

<body>
<div class="layui-container">
    <div class="layui-row">
        <blockquote class="layui-elem-quote layui-quote-nm">添加用户</blockquote>
    </div>
    <div class="layui-row" style="margin-top: 25px;">
        <form class="layui-form" action="/index" method="post">
            {% csrf_token %}
            <div class="layui-form-item">
                <label class="layui-form-label">用户名</label>
                <div class="layui-input-block">
                    <input type="text" name="username" required lay-verify="required" placeholder="请输入用户名"
                           autocomplete="off" class="layui-input">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">性别</label>
                <div class="layui-input-block">
                    <input type="radio" name="sex" value="男" title="男">
                    <input type="radio" name="sex" value="女" title="女" checked>
                    <input type="radio" name="sex" value="" title="中性" disabled>
                </div>
            </div>

            <div class="layui-form-item layui-form-text">
                <label class="layui-form-label">签名</label>
                <div class="layui-input-block">
                    <textarea name="sign" placeholder="请输入内容" class="layui-textarea"></textarea>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-input-block">
                    <button class="layui-btn" lay-submit lay-filter="formDemo">立即提交</button>
                    <button type="reset" class="layui-btn layui-btn-primary">重置</button>
                </div>
            </div>
        </form>
    </div>
    <div class="layui-row">
        <blockquote class="layui-elem-quote layui-quote-nm">用户列表</blockquote>
    </div>
    <div class="layui-row">
        <table class="layui-table">
            <colgroup>
                <col width="100">
                <col width="100">
                <col width="100">
            </colgroup>
            <thead>
            <tr>
                <th>用户名</th>
                <th>性别</th>
                <th>签名</th>
            </tr>
            </thead>
            <tbody>
			<!----------Begin---------->
            {% for d in list %}
                <tr>
                    <td>{{ d.username }}</td>
                    <td>{{ d.sex }}</td>
                    <td>{{ d.sign }}</td>
                </tr>
            {% endfor %}
			<!----------End---------->
            </tbody>
        </table>
    </div>
</div>

</body>

<script src="/static/layui/layui.all.js"></script>
<script src="/static/layui/jquery-3.1.1.min.js"></script>
<script>
    layui.use('form', function () {
        var form = layui.form;
        form.render();

    });
</script>

</html>
