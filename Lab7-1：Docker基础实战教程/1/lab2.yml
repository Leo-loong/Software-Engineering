apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-lab2-deploy
  labels:
    studentid: "24376280"
    studentname: "匡自龙"
spec:
  replicas: 5
  selector:
    matchLabels:
      studentid: "24376280"
  template:
    metadata:
      labels:
        studentid: "24376280"
        studentname: "匡自龙"
    spec:
      containers:
      - name: nginx-container
        image: nginx:latest
        ports:
        - containerPort: 8080